name: Verify Windows source
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DDUST_STATIC_RUNTIME=ON
      - name: Verify development build
        run: cmake --build build --config Debug
